version: "3.8"
services:
  myssql:
    image: mysql:8.0.28
    container_name: myssql-markvarte
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql:/var/lib/mysql
    env_file:
      - db.env
  headlines-server:
    image: node:14-alpine
    command: node /app/server.js
    volumes:
      - ./marking-headlines-server:/app 
    depends_on:
      - myssql
    ports:
      - "9001:8080"
  hedlines-front-end:
    image: nginx:1.21
    volumes: 
      - ./marking-headlines-front/marking-headlines-front/dist/marking-headlines-front:/usr/share/nginx/html    
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    network_mode: "host"
